<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethereal Drain — Draincore Fashion</title>
  <meta name="description" content="Уникальная draincore одежда от $25. Лимитированные коллекции, кастом дизайн, доставка по всему миру.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Custom Cursor */
    *, *::before, *::after {
      cursor: none !important;
    }
    
    body, html {
      cursor: none !important;
    }
    
    input, textarea, select {
      cursor: none !important;
    }
    
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(45deg, #6366f1, #ec4899);
      pointer-events: none;
      z-index: 99999;
      mix-blend-mode: difference;
      transition: all 0.15s ease;
      transform: translate(-50%, -50%);
    }
    
    .cursor-follower {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.6);
      pointer-events: none;
      z-index: 99998;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translate(-50%, -50%);
    }
    
    .cursor.hover {
      transform: translate(-50%, -50%) scale(2.5);
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
    }
    
    .cursor.click {
      transform: translate(-50%, -50%) scale(0.8);
      background: #ec4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.8);
    }
    
    .cursor.text {
      transform: translate(-50%, -50%) scaleX(0.3);
      background: linear-gradient(45deg, #6366f1, #8b5cf6);
      border-radius: 10px;
    }
    
    :root {
      --primary-indigo: #6366f1;
      --primary-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --dark-bg: #0f0f0f;
      --darker-bg: #0a0a0a;
      --card-bg: rgba(20, 20, 20, 0.8);
      --border-color: rgba(99, 102, 241, 0.2);
      --text-primary: #e5e7eb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --drain-silver: #c4c4c4;
      --drain-black: #1a1a1a;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--darker-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 70%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: backgroundShift 25s ease-in-out infinite;
    }
